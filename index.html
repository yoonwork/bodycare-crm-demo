<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바름결 바디랩 · 고객관리 데모</title>
<meta name="description" content="바디케어 고객관리 웹앱 제안용 데모. 관찰 항목 체크로 관리 프로그램 후보를 찾고, 고객은 휴대폰으로 이력과 홈운동을 확인해요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312804C'/%3E%3Cpath d='M10 22c3-8 9-12 12-12-1 6-5 11-12 12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style id="tokens">
:root{
  color-scheme: light;
  --brand:#12804C; --brand-hover:#0B6B42; --brand-press:#085634; --brand-text:#0B6B42;
  --brand-tint:#EBF7F0; --brand-tint-2:#CDEBDA; --ring:0 0 0 3px rgba(18,128,76,.25);
  --on-brand:#FFFFFF;
  --bg:#F2F4F7; --card:#FFFFFF; --soft:#F7F8FA; --track:#ECEFF3; --line:#E5E8EB; --line-2:#EBEEF2;
  --ink:#191F28; --ink-2:#4E5968; --mut:#636D7B; --mut-2:#9AA3AE;
  --ok:#127A4F;   --ok-bg:#E3F6ED;   --ok-dot:#1FA971;
  --warn:#7A5600; --warn-bg:#FFF3D4; --warn-dot:#F2B01E;
  --bad:#BF2930;  --bad-bg:#FFE3E4;  --bad-dot:#E5484D;
  --info:#175CD3; --info-bg:#EAF2FF; --info-dot:#2E7CF6;
  --neu:#4E5968;  --neu-bg:#F0F2F5;  --neu-dot:#8B95A1;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-17:17px;
  --fs-20:20px; --fs-24:24px; --fs-32:32px; --fs-44:44px;
  --lh-tight:1.3; --lh-body:1.6;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --sh-pill:0 1px 2px rgba(16,24,40,.08);
  --sh-pop:0 2px 6px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.12);
  --h-sm:32px; --h-md:40px; --h-lg:48px; --h-cta:52px;
  --container:1280px;
}
</style>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-15);line-height:var(--lh-body);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 데모 띠 */
.band{background:var(--ink);color:#fff;font-size:var(--fs-13);padding:8px 16px;text-align:center;line-height:1.5}
.band b{font-weight:600}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:rgba(242,244,247,.96);border-bottom:1px solid var(--line-2)}
.top-in{max-width:var(--container);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-17);white-space:nowrap}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.logo small{font-weight:500;color:var(--mut);font-size:var(--fs-13)}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:12px}
.rolebox .lbl{font-size:var(--fs-13);color:var(--mut);white-space:nowrap}
.seg{display:flex;background:var(--track);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{border:0;background:transparent;height:40px;padding:0 16px;border-radius:var(--r-pill);font-size:var(--fs-14);font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-pill)}
.seg button:hover{color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--soft)}

/* 공통 */
.wrap{max-width:var(--container);margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:24px}
.card.tight{padding:16px}
.h1{font-size:var(--fs-24);font-weight:700;line-height:var(--lh-tight);margin:0}
.h2{font-size:var(--fs-20);font-weight:700;line-height:var(--lh-tight);margin:0}
.h3{font-size:var(--fs-17);font-weight:700;line-height:var(--lh-tight);margin:0}
.sub{color:var(--mut);font-size:var(--fs-14);margin:4px 0 0}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:12px}
.hr{height:1px;background:var(--line-2);margin:16px 0;border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-size:var(--fs-15);font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hover)}
.btn.pri:active{background:var(--brand-press)}
.btn.pri:disabled{background:var(--track);border-color:var(--track);color:var(--mut-2);cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-text)}
.btn.ghost:hover{background:var(--brand-tint)}
.btn.sm{height:36px;padding:0 14px;font-size:var(--fs-14)}
.btn.block{width:100%;height:var(--h-cta);border-radius:var(--r-md);font-size:var(--fs-17)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-12);font-weight:600;background:var(--neu-bg);color:var(--neu);white-space:nowrap}
.tag .d{width:6px;height:6px;border-radius:50%;background:var(--neu-dot)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.ok .d{background:var(--ok-dot)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.warn .d{background:var(--warn-dot)}
.tag.info{background:var(--info-bg);color:var(--info)}.tag.info .d{background:var(--info-dot)}
.tag.line{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-size:var(--fs-14);font-weight:500;color:var(--ink-2);text-align:left;line-height:1.4}
.chip:hover{border-color:var(--mut-2)}
.chip[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-text);font-weight:600}
.chip .ck{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--mut-2);display:grid;place-items:center;flex:none;background:#fff}
.chip[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand)}
.chip .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chip[aria-pressed="true"] .ck svg{opacity:1}
.chip.sm{min-height:36px;padding:6px 12px;font-size:var(--fs-13)}
.field{display:block}
.field>span{display:block;font-size:var(--fs-14);font-weight:600;margin-bottom:8px;color:var(--ink)}
.field>span em{font-style:normal;color:var(--bad);margin-left:2px}
.field>span i{font-style:normal;font-weight:500;color:var(--mut)}
.inp{width:100%;height:var(--h-lg);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px;background:#fff;font-size:var(--fs-15)}
textarea.inp{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.inp::placeholder{color:var(--mut-2)}
.help{font-size:var(--fs-13);color:var(--mut);margin-top:6px}
.err{font-size:var(--fs-13);color:var(--bad);margin-top:6px}
.note{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--soft);font-size:var(--fs-13);color:var(--ink-2);line-height:1.5}
.note svg{width:16px;height:16px;margin-top:2px;color:var(--mut)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.warn svg{color:var(--warn)}
.empty{padding:32px 16px;text-align:center;color:var(--mut);font-size:var(--fs-14)}
.ex-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:var(--fs-12);font-weight:600;white-space:nowrap}

/* 관리사 */
.t-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.clist{padding:16px;position:sticky;top:96px}
.search{position:relative;display:block;margin:12px 0}
.search svg{position:absolute;left:14px;top:14px;color:var(--mut)}
.search .inp{padding-left:42px;border-radius:var(--r-pill);height:48px;background:var(--soft);border-color:var(--soft)}
.citem{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:transparent;border-radius:var(--r-md);text-align:left;min-height:64px}
.citem:hover{background:var(--soft)}
.citem[aria-current="true"]{background:var(--brand-tint)}
.av{width:40px;height:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:var(--fs-15);color:var(--ink-2);flex:none}
.citem[aria-current="true"] .av{background:var(--brand);color:#fff}
.citem .nm{font-weight:600;font-size:var(--fs-15)}
.citem .meta{font-size:var(--fs-13);color:var(--mut)}
.citem .rt{margin-left:auto;text-align:right;font-size:var(--fs-13);color:var(--mut);white-space:nowrap}
.citem .rt b{display:block;color:var(--ink);font-size:var(--fs-15)}
.chead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chead .av{width:56px;height:56px;font-size:var(--fs-20);background:var(--brand-tint);color:var(--brand-text)}
.kpis{display:flex;gap:24px;margin-left:auto}
.kpi .k{font-size:var(--fs-13);color:var(--mut)}
.kpi .v{font-size:var(--fs-20);font-weight:700}
.kpi .v small{font-size:var(--fs-13);color:var(--mut);font-weight:500;margin-left:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin:20px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;height:48px;padding:0 16px;font-weight:600;font-size:var(--fs-15);color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rec{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start;margin-top:20px}
.step{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);font-weight:600;color:var(--mut);margin-bottom:8px}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:var(--fs-12)}
.grp{margin-top:16px}
.grp-t{font-size:var(--fs-13);font-weight:600;color:var(--mut);margin-bottom:8px}
.cands{display:flex;flex-direction:column;gap:12px}
.cand{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:#fff}
.cand.on{border-color:var(--brand);background:var(--brand-tint)}
.cand .score{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--ink-2)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;max-width:120px}
.bar i{display:block;height:100%;background:var(--brand-tint-2)}
.cand:first-child .bar i{background:var(--brand)}
.cand .why{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cand .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.musc{display:flex;flex-wrap:wrap;gap:8px}
.musc .m{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--soft);font-size:var(--fs-13);font-weight:600}
.musc .m b{font-weight:700;color:var(--brand-text)}
.internal{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-12);font-weight:600;color:var(--ink-2);background:var(--track);border-radius:var(--r-pill);padding:4px 10px;white-space:nowrap}
.internal svg{width:14px;height:14px}
.visit{border:1px solid var(--line-2);border-radius:16px;padding:16px}
.visit+.visit{margin-top:12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:var(--fs-14)}
.kv dt{color:var(--mut)}
.kv dd{margin:0}
.save-bar{display:flex;align-items:center;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.check-line{display:flex;align-items:center;gap:8px;font-size:var(--fs-14);min-height:44px}
.check-line input{width:20px;height:20px;accent-color:var(--brand)}
.back{display:none}
.jump{display:none}
@media (max-width:1100px){.jump{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:25;height:48px;padding:0 20px;border-radius:var(--r-pill);border:0;background:var(--ink);color:#fff;font-weight:600;font-size:var(--fs-14);box-shadow:var(--sh-pop);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}}

/* 관리자 */
.a-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.a-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.plist .pi{width:100%;display:block;text-align:left;border:0;background:transparent;padding:12px;border-radius:var(--r-md);min-height:56px}
.plist .pi:hover{background:var(--soft)}
.plist .pi[aria-current="true"]{background:var(--brand-tint)}
.plist .pi b{display:block;font-size:var(--fs-15)}
.plist .pi span{font-size:var(--fs-13);color:var(--mut)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mx-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:16px;background:#fff}
.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:var(--fs-14)}
.mx th,.mx td{border-bottom:1px solid var(--line-2);padding:6px;text-align:center}
.mx thead th{background:var(--soft);font-size:var(--fs-12);font-weight:600;color:var(--mut);vertical-align:bottom;padding:12px 6px;line-height:1.35}
.mx th.rh,.mx td.rh{text-align:left;position:sticky;left:0;background:#fff;z-index:1;padding:8px 16px;min-width:220px;font-weight:500;font-size:var(--fs-14);border-right:1px solid var(--line-2)}
.mx thead th.rh{background:var(--soft);z-index:2}
.mx tr:last-child td{border-bottom:0}
.mx .grp-row td{background:var(--soft);font-size:var(--fs-12);font-weight:600;color:var(--mut);text-align:left;padding:8px 16px}
.mx .grp-row td.rh{background:var(--soft)}
.tg{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center}
.tg svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.tg[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.tg[aria-pressed="true"] svg{opacity:1}
.tg:hover{border-color:var(--brand)}
.mx td.cnt{font-size:var(--fs-13);color:var(--mut)}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--warn-bg)}100%{background:transparent}}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-14)}
.tbl th{background:var(--soft);font-size:var(--fs-13);color:var(--mut);font-weight:600;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);height:56px}
.tbl tr:last-child td{border-bottom:0}
.sw{position:relative;width:48px;height:28px;border-radius:14px;border:0;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--sh-pill);transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:23px}
.sw:disabled{opacity:.5;cursor:not-allowed}
.sw-cell{display:flex;align-items:center;min-height:44px}
.dl-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dl{border:1px solid var(--line-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ex-row{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.2fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ex-row:last-child{border-bottom:0}

/* 고객 */
.c-stage{display:grid;grid-template-columns:minmax(0,1fr) 420px minmax(0,1fr);gap:32px;align-items:start}
.c-side{padding-top:24px}
.c-side .h3{margin-bottom:8px}
.c-side p{font-size:var(--fs-14);color:var(--ink-2);margin:0 0 12px}
.phone{background:#F7F8FA;border:1px solid var(--line-2);border-radius:32px;overflow:hidden;min-height:760px;display:flex;flex-direction:column;position:relative}
.ph-body{padding:20px 16px 24px;flex:1}
.ph-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.ph-top .h2{font-size:var(--fs-20)}
.hero{background:#fff;border-radius:24px;padding:20px;border:1px solid var(--line-2)}
.hero.tint{background:var(--brand-tint);border-color:var(--brand-tint-2)}
.big{font-size:var(--fs-44);font-weight:700;line-height:1;letter-spacing:-.02em}
.big small{font-size:var(--fs-17);font-weight:600;color:var(--ink-2);margin-left:4px;letter-spacing:0}
.pbar{height:8px;border-radius:4px;background:rgba(18,128,76,.15);overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.hw{background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:16px}
.hw+.hw{margin-top:12px}
.vid{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(180deg,#E9EDF1,#DDE3E9);display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:var(--fs-13);padding:12px;margin:12px 0}
.vid .pl{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 8px;box-shadow:var(--sh-pill)}
.vid .pl svg{width:20px;height:20px;fill:var(--ink);stroke:none;margin-left:3px}
.donebtn{height:48px;width:100%;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;font-weight:600;font-size:var(--fs-15);display:flex;align-items:center;justify-content:center;gap:8px}
.donebtn[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.week{display:flex;gap:6px;margin-top:12px}
.week span{flex:1;text-align:center;font-size:var(--fs-12);color:var(--mut)}
.week span i{display:block;height:28px;border-radius:8px;background:var(--track);margin-bottom:4px}
.week span.on i{background:var(--brand)}
.tabbar{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line-2);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}

function candidates(checked){
  var sc={},why={};
  checked.forEach(function(cid){(S.links[cid]||[]).forEach(function(pid){sc[pid]=(sc[pid]||0)+1;(why[pid]=why[pid]||[]).push(cid);});});
  return Object.keys(sc).map(function(pid){return {p:prog(pid),n:sc[pid],why:why[pid]};})
    .filter(function(x){return x.p;})
    .sort(function(a,b){return b.n-a.n||S.programs.indexOf(a.p)-S.programs.indexOf(b.p);});
}
function muscleSummary(cands){
  var m={};cands.forEach(function(c){c.p.muscles.forEach(function(x){m[x]=(m[x]||0)+c.n;});});
  return Object.keys(m).map(function(k){return {k:k,n:m[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,8);
}

  h+='</div><div class="sheet-f"><button class="btn" data-act="close">닫기</button><button class="btn pri" data-act="choose" data-v="'+pid+'" data-close="1">'+(on?'고른 것에서 빼기':'이 프로그램 고르기')+'</button></div></div></div>';
  document.getElementById('layer').innerHTML=h;
  document.body.style.overflow='hidden';
}

  '<form data-form="newcust"><div class="sheet-b stack">'+
  '<div class="form2"><label class="field"><span>이름<em>*</em></span><input class="inp" id="n-name" placeholder="예: 강민지" autocomplete="off"></label><label class="field"><span>휴대폰 번호<em>*</em></span><input class="inp num" id="n-phone" inputmode="numeric" placeholder="010-0000-0000"></label></div>'+
  '<div class="field"><span>연령대</span><div class="chips" data-group="age">'+['20대','30대','40대','50대','60대 이상'].map(function(x,i){return '<button type="button" class="chip sm" data-act="radio" data-v="'+x+'" aria-pressed="'+(i===1)+'">'+x+'</button>';}).join('')+'</div></div>'+
  '<div class="field"><span>패키지</span><div class="chips" data-group="pkg">'+['체험 3회','바디케어 10회','바디케어 20회'].map(function(x,i){return '<button type="button" class="chip sm" data-act="radio" data-v="'+x+'" aria-pressed="'+(i===1)+'">'+x+'</button>';}).join('')+'</div></div>'+
  '<label class="field"><span>상담 내용<em>*</em></span><textarea class="inp" id="n-consult" placeholder="불편한 곳, 생활 습관, 원하는 관리"></textarea></label>'+
  '<div class="field"><span>압 세기 선호</span><div class="chips" data-group="press">'+['약하게','보통','강하게'].map(function(x,i){return '<button type="button" class="chip sm" data-act="radio" data-v="'+x+'" aria-pressed="'+(i===1)+'">'+x+'</button>';}).join('')+'</div></div>'+
  '<label class="field"><span>피하고 싶은 부위·기타 <i>(선택)</i></span><input class="inp" id="n-etc" placeholder="예: 배 부위는 피하기, 향 없는 오일"></label>'+
  '<label class="check-line"><input type="checkbox" id="n-agree"> 개인정보 수집·이용 동의를 받았어요 (실제 버전은 고객이 휴대폰에서 직접 동의)</label><div id="n-err" class="err" role="alert"></div>'+
  '</div><div class="sheet-f"><button type="button" class="btn" data-act="close">닫기</button><button class="btn pri" type="submit">등록하기</button></div></form></div></div>';
  document.getElementById('layer').innerHTML=h;document.body.style.overflow='hidden';
  setTimeout(function(){var n=document.getElementById('n-name');if(n&&window.innerWidth>760)n.focus();},30);
}
function closeLayer(){document.getElementById('layer').innerHTML='';document.body.style.overflow='';}

var tt;
function toast(msg,act,label){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(act?'<button data-act="'+act+'">'+esc(label)+'</button>':'');
  document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove();},3600);
}

/* ---------- 그리기 ---------- */
function render(){
  document.querySelectorAll('[data-act="role"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===U.role));});
  document.body.className='role-'+U.role+(U.detail?' detail':'');
  var app=document.getElementById('app');
  app.innerHTML=U.role==='therapist'?vTherapist():U.role==='admin'?vAdmin():vCustomer();
  document.querySelectorAll('.tabs').forEach(function(t){var sel=t.querySelector('[aria-selected="true"]');if(sel&&t.scrollWidth>t.clientWidth)t.scrollLeft=Math.max(0,sel.offsetLeft-t.offsetLeft-24);});
  saveUI();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(a==='close'){if(el.classList.contains('dim')&&e.target!==el)return;closeLayer();return;}
  switch(a){
  case 'role':U.role=v;closeLayer();render();window.scrollTo(0,0);break;
  case 'reset':if(confirm('데모 기록을 지우고 예시 데이터로 돌아갈까요?')){S=seed();U.drafts={};U.cid='u1';U.custId='u1';U.custIn=false;U.custTab='home';save();closeLayer();render();toast('예시 데이터로 되돌렸어요');}break;
  case 'pick':U.cid=v;U.ctab='record';U.detail=true;render();if(window.innerWidth<=760)window.scrollTo(0,0);break;
  case 'backlist':U.detail=false;render();break;
  case 'clearq':U.q='';render();break;
  case 'ctab':U.ctab=v;render();break;
  case 'chk':var d=draft(U.cid);toggle(d.checked,v);
    var ok=candidates(d.checked).map(function(x){return x.p.id;});d.chosen=d.chosen.filter(function(p){return ok.indexOf(p)>=0;});d.hw=null;render();break;
  case 'clearchk':var d2=draft(U.cid);d2.checked=[];d2.chosen=[];d2.hw=null;render();break;
  case 'jump':var cd=document.getElementById('cands');if(cd){window.scrollTo(0,cd.getBoundingClientRect().top+window.scrollY-160);}break;
  case 'pdetail':openProg(v);break;
  case 'choose':var d3=draft(U.cid);toggle(d3.chosen,v);d3.hw=null;if(el.dataset.close)closeLayer();render();
    if(d3.chosen.indexOf(v)>=0)toast(prog(v).name+' 골랐어요');break;
  case 'hwpick':toggle(draft(U.cid).hw,v);render();break;
  case 'saverec':saveRecord(el);break;
  case 'press':var c=cust(U.cid);c.pref.press=v;save();render();break;
  case 'saveinfo':var c2=cust(U.cid);c2.consult=document.getElementById('i-consult').value.trim();c2.pref.avoid=document.getElementById('i-avoid').value.trim();c2.pref.etc=document.getElementById('i-etc').value.trim();save();toast('상담 내용을 저장했어요');break;
  case 'newcust':openNewCust();break;
  case 'radio':el.parentNode.querySelectorAll('[data-act="radio"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});break;
  case 'atab':U.atab=v;render();break;
  case 'link':var l=S.links[el.dataset.i]=S.links[el.dataset.i]||[];toggle(l,el.dataset.p);save();
    var on=l.indexOf(el.dataset.p)>=0;el.setAttribute('aria-pressed',String(on));var row=el.closest('tr');row.querySelector('.cnt').textContent=l.length+'개';
    var n=0;Object.keys(S.links).forEach(function(k){n+=S.links[k].length;});document.getElementById('nOn').textContent=n;
    toast((on?'연결했어요: ':'연결을 껐어요: ')+item(el.dataset.i).label+' → '+prog(el.dataset.p).name,'gotherapist','관리사 화면 보기');break;
  case 'gotherapist':U.role='therapist';U.ctab='record';U.detail=true;render();window.scrollTo(0,0);break;
  case 'pickprog':U.pid=v;render();if(window.innerWidth<=760){var f=document.querySelector('[data-form="saveprog"]');if(f)f.scrollIntoView();}break;
  case 'newprog':var id='p'+(++S.seq);S.programs.push({id:id,name:'새 프로그램',area:'',min:20,muscles:[],method:[],caution:[],ex:[]});U.pid=id;save();render();toast('새 프로그램을 만들었어요. 이름과 내용을 채워 주세요');var nm=document.getElementById('pf-name');if(nm){nm.focus();nm.select();}break;
  case 'delprog':if(S.programs.length<=1)break;if(!confirm('이 프로그램을 지울까요? 연결 기준에서도 빠져요.'))break;
    var pid=U.pid;S.programs=S.programs.filter(function(x){return x.id!==pid;});Object.keys(S.links).forEach(function(k){S.links[k]=S.links[k].filter(function(x){return x!==pid;});});U.pid=S.programs[0].id;save();render();toast('프로그램을 지웠어요');break;
  case 'pfex':el.setAttribute('aria-pressed',String(el.getAttribute('aria-pressed')!=='true'));break;
  case 'perm':var acc=byId(S.accounts,el.dataset.a);acc.perm[el.dataset.k]=!acc.perm[el.dataset.k];el.setAttribute('aria-checked',String(acc.perm[el.dataset.k]));save();toast(acc.name+' 권한을 바꿨어요');break;
  case 'csv':downloadCSV(v);break;
  case 'toast':toast(v);break;
  case 'custpick':U.custId=v;render();break;
  case 'login':U.custIn=true;U.custTab='home';render();break;
  case 'logout':U.custIn=false;render();break;
  case 'custtab':U.custTab=v;render();window.scrollTo(0,0);break;
  case 'done':var cc=cust(U.custId);var hw=cc.hw.filter(function(x){return x.ex===v;})[0];if(hw){var i=hw.done.indexOf(TODAY);if(i<0){hw.done.push(TODAY);toast('잘하셨어요. 관리사에게도 보여요');}else hw.done.splice(i,1);save();render();}break;
  case 'gocustomer':U.role='customer';U.custId=el.dataset.c||U.custId;U.custIn=true;U.custTab='home';render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){U.q=e.target.value;document.getElementById('clist-items').innerHTML=custItems(S.customers.filter(function(x){var q=U.q.trim();return !q||x.name.indexOf(q)>=0||x.phone.indexOf(q)>=0||(x.consult||'').indexOf(q)>=0;}));}
  if(e.target.id==='memo')draft(U.cid).memo=e.target.value;
  if(e.target.id==='note')draft(U.cid).note=e.target.value;
});
document.addEventListener('change',function(e){if(e.target.id==='deduct')draft(U.cid).deduct=e.target.checked;});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('layer').innerHTML)closeLayer();});
document.addEventListener('submit',function(e){
  var f=e.target;var t=f.dataset.form;if(!t)return;e.preventDefault();
  if(t==='additem'){var inp=document.getElementById('newitem');var val=inp.value.trim();if(!val){inp.focus();toast('추가할 항목 이름을 써 주세요');return;}
    var id='c'+(++S.seq);S.items.push({id:id,g:'새로 추가한 항목',label:val});S.links[id]=[];save();render();toast('항목을 추가했어요. 오른쪽 칸을 눌러 프로그램과 연결해 주세요');}
  if(t==='saveprog'){var p=prog(U.pid);var name=document.getElementById('pf-name').value.trim();if(!name){toast('프로그램 이름을 써 주세요');return;}
    p.name=name;p.area=document.getElementById('pf-area').value.trim();p.min=+document.getElementById('pf-min').value||20;
    p.muscles=document.getElementById('pf-mus').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    p.method=document.getElementById('pf-method').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    p.caution=document.getElementById('pf-caution').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    p.ex=[].map.call(f.querySelectorAll('[data-act="pfex"][aria-pressed="true"]'),function(b){return b.dataset.v;});
    save();render();toast('저장했어요. 관리사 화면에 바로 반영돼요');}
  if(t==='saveex'){var ex=exer(f.dataset.v);var url=f.video.value.trim();if(url&&!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(url)){toast('유튜브 주소(https://youtu.be/…)를 넣어 주세요');return;}ex.video=url;save();toast(url?'영상 주소를 저장했어요':'영상 주소를 비웠어요');}
  if(t==='newcust'){var nm=document.getElementById('n-name').value.trim(),ph=document.getElementById('n-phone').value.replace(/[^0-9]/g,''),cs=document.getElementById('n-consult').value.trim(),er=document.getElementById('n-err');
    if(!nm){er.textContent='이름을 써 주세요';return;}
    if(ph.length!==11){er.textContent='휴대폰 번호 11자리를 모두 써 주세요';return;}
    if(!cs){er.textContent='상담 내용을 한 줄이라도 써 주세요';return;}
    if(!document.getElementById('n-agree').checked){er.textContent='개인정보 동의를 받았는지 체크해 주세요';return;}
    function pick(g){var b=f.querySelector('[data-group="'+g+'"] [aria-pressed="true"]');return b?b.dataset.v:'';}
    var pk=pick('pkg');var tot=pk.indexOf('20')>=0?20:pk.indexOf('3')>=0?3:10;
    var masked=nm.charAt(0)+'O'+nm.slice(2);if(nm.length<=2)masked=nm.charAt(0)+'O';
    var etc=document.getElementById('n-etc').value.trim();
    var id='u'+(++S.seq);var d=new Date();d.setMonth(d.getMonth()+3);
    S.customers.unshift({id:id,name:masked,age:pick('age'),sex:'-',phone:'010-****-'+ph.slice(7),job:'-',pkg:{name:pk,total:tot,used:0,until:d.toISOString().slice(0,10)},consult:cs,pref:{press:pick('press'),avoid:'',etc:etc},next:'예약 없음',visits:[],hw:[]});
    save();closeLayer();U.cid=id;U.ctab='record';U.detail=true;render();toast(masked+'님을 등록했어요. 바로 관리 기록을 쓸 수 있어요');}
});
function saveRecord(btn){
  var c=cust(U.cid),d=draft(U.cid);
  if(!d.chosen.length){toast('프로그램을 하나 이상 골라 주세요');return;}
  btn.disabled=true;btn.textContent='저장하는 중';
  setTimeout(function(){
    var no=(c.visits.length?c.visits[c.visits.length-1].no:c.pkg.used)+1;
    c.visits.push({no:no,date:TODAY,by:'김O림',checks:d.checked.slice(),progs:d.chosen.slice(),memo:d.memo.trim(),note:d.note.trim(),ex:(d.hw||[]).slice()});
    if(d.deduct&&c.pkg.used<c.pkg.total)c.pkg.used++;
    var old=c.hw||[];c.hw=(d.hw||[]).map(function(e){var o=old.filter(function(x){return x.ex===e;})[0];return {ex:e,done:o?o.done:[]};});
    delete U.drafts[c.id];save();U.ctab='history';render();
    var t=document.querySelector('.tabs');if(t&&window.innerWidth<=760)t.scrollIntoView();
    toast(no+'회차 기록을 저장했어요','gocustomer','고객 화면 보기');
    var tb=document.querySelector('.toast [data-act="gocustomer"]');if(tb)tb.dataset.c=c.id;
  },400);
}
function downloadCSV(kind){
  var rows=[];
  if(kind==='cust'){rows.push(['고객','연령대','휴대폰','패키지','사용','전체','상담 내용','압 선호']);S.customers.forEach(function(c){rows.push([c.name,c.age,c.phone,c.pkg.name,c.pkg.used,c.pkg.total,c.consult,c.pref.press]);});}
  else if(kind==='visit'){rows.push(['고객','회차','날짜','관리사','관찰 항목','프로그램','관리 메모','고객 한마디']);S.customers.forEach(function(c){c.visits.forEach(function(v){rows.push([c.name,v.no,v.date,v.by,v.checks.map(function(i){var x=item(i);return x?x.label:'';}).join(' / '),v.progs.map(function(p){var x=prog(p);return x?x.name:'';}).join(' / '),v.memo,v.note]);});});}
  else{rows.push(['체크 항목'].concat(S.programs.map(function(p){return p.name;})));S.items.forEach(function(it){rows.push([it.label].concat(S.programs.map(function(p){return (S.links[it.id]||[]).indexOf(p.id)>=0?'O':'';})));});}
  var csv='﻿'+rows.map(function(r){return r.map(function(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='바름결_'+({cust:'고객',visit:'방문기록',links:'연결기준'}[kind])+'_'+TODAY+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('CSV 파일을 내려받았어요');
}
window.__demo={get S(){return S;},U:U,candidates:candidates};
render();
})();
